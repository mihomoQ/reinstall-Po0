name: PO0 offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser only
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Parse installer scripts without executing them
        run: |
          bash -n reinstall.sh
          busybox ash -n trans.sh
          busybox ash -n initrd-network.sh
          busybox ash -n po0-chrony.sh
          busybox ash -n po0-cloud.sh
          sh -n po0-lib.sh
      - name: Run isolated tests
        run: |
          python3 -m unittest discover -s tests -p 'test*.py' -v
          busybox ash tests/test-network.sh
          bash tests/test-trans.sh
          sh tests/test-chrony.sh
          bash tests/test-trans-chrony.sh
          sh tests/test-cloud-transport.sh
          bash tests/test-trans-cloud.sh
      - name: Build and verify the portable bundle
        run: |
          python3 tools/build-bundle.py
          python3 tools/build-worker.py
          bash -n dist/worker/reinstall.sh
          mkdir -p dist/check
          tar xzf dist/reinstall-Po0.tar.gz -C dist/check
          cd dist/check/reinstall-Po0
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: reinstall-Po0-candidate
          path: |
            dist/reinstall-Po0.tar.gz
            dist/worker/reinstall.sh
